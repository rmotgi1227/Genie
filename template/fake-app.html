<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SPEC}}</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; color: #1d1d1f; }
  h1 { font-size: 22px; } h2 { font-size: 16px; margin: 20px 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  input { padding: 6px 8px; font: inherit; } button { padding: 6px 10px; font: inherit; cursor: pointer; }
  .chip { background: #eef; border-radius: 12px; padding: 2px 10px; }
  .total { font-weight: 600; }
  footer { margin-top: 32px; font-size: 13px; color: #666; }
</style>
</head>
<body>
<h1>Split the bill by item</h1>
<h2>People</h2>
<div id="people"></div>
<div class="row"><input id="pname" placeholder="Name"><button id="addp">Add person</button></div>
<h2>Items</h2>
<div id="items"></div>
<div class="row"><input id="iname" placeholder="Item"><input id="iprice" type="number" placeholder="Price" style="width:90px"><button id="addi">Add item</button></div>
<h2>Who owes what</h2>
<div id="totals"></div>
<footer>Wished by u/{{WISHER}}, granted by Genie (open source) · report a bug → <a href="{{ISSUES_URL}}">{{ISSUES_URL}}</a></footer>
<script>
let people = ['Ana', 'Ben', 'Cy']
let items = [
  { name: 'Pizza', price: 24, who: ['Ana', 'Ben', 'Cy'] },
  { name: 'Wine', price: 30, who: ['Ana', 'Ben'] },
]
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

function renderPeople() {
  $('people').innerHTML = people.map((p) =>
    `<div class="row"><span class="chip">${esc(p)}</span><button data-remove="${esc(p)}">remove</button></div>`).join('')
}
function renderItems() {
  $('items').innerHTML = items.map((it, i) =>
    `<div class="row"><b>${esc(it.name)}</b> $${it.price.toFixed(2)} ` +
    people.map((p) => `<label><input type="checkbox" data-item="${i}" data-person="${esc(p)}" ${it.who.includes(p) ? 'checked' : ''}>${esc(p)}</label>`).join(' ') +
    `</div>`).join('')
}
function renderTotals() {
  const owe = Object.fromEntries(people.map((p) => [p, 0]))
  for (const it of items) for (const p of it.who) if (p in owe) owe[p] += it.price / it.who.length
  $('totals').innerHTML = people.map((p) => `<div class="row">${esc(p)}: <span class="total">$${owe[p].toFixed(2)}</span></div>`).join('')
}
function render() { renderPeople(); renderItems(); renderTotals() }

function removePerson(name) {
  people = people.filter((p) => p !== name)
  items.forEach((it) => { it.who = it.who.filter((w) => w !== name) })
  renderPeople(); renderItems() /*BUG*/
}

$('addp').onclick = () => { const n = $('pname').value.trim(); if (n && !people.includes(n)) { people.push(n); $('pname').value = ''; render() } }
$('addi').onclick = () => {
  const name = $('iname').value.trim(), price = parseFloat($('iprice').value)
  if (name && price > 0) { items.push({ name, price, who: [...people] }); $('iname').value = ''; $('iprice').value = ''; render() }
}
document.body.addEventListener('click', (e) => { const n = e.target.dataset?.remove; if (n) removePerson(n) })
document.body.addEventListener('change', (e) => {
  const { item, person } = e.target.dataset ?? {}
  if (item === undefined) return
  const it = items[item]
  it.who = e.target.checked ? [...it.who, person] : it.who.filter((w) => w !== person)
  renderTotals()
})
render()
</script>
</body>
</html>
