<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0c0a; --panel: #15140f; --line: #2a2820; --line-2: #3a372c;
    --text: #efe9dc; --text-2: #bdb6a6; --muted: #837d70; --faint: #55524a;
    --accent: #f0a53a; --accent-ink: #1a1206; --accent-soft: rgba(240,165,58,.12);
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.2,.7,.2,1); --fast: 260ms; --slow: 560ms;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { color: var(--text); font: 500 18px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .hide { display: none !important; }

  /* The whole board is a 1920×1080 stage scaled to fit the window, so it looks the same everywhere. */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; display: flex; flex-direction: column; padding: 44px 72px 36px; }

  header { display: flex; align-items: center; gap: 20px; height: 48px; flex: none; }
  .wordmark { font-weight: 700; font-size: 32px; letter-spacing: -.04em; line-height: 1; }
  .chip { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--muted); }
  .stats { display: flex; gap: 36px; margin-left: 40px; }
  .stat { display: flex; align-items: baseline; gap: 10px; }
  .stat b { font: 600 26px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stat span { font-size: 13px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .clock { margin-left: auto; display: flex; align-items: baseline; gap: 14px; }
  .clock b { font: 600 32px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .clock b.live { color: var(--accent); }
  .clock span { font-size: 15px; color: var(--muted); }

  #cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1080px 1fr; gap: 64px; margin-top: 36px; }
  #left, #right { display: flex; flex-direction: column; min-height: 0; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font: 600 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); height: 16px; flex: none; }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
  .eyebrow .n { color: var(--faint); margin-left: auto; letter-spacing: .08em; }
  .in { animation: rise var(--slow) var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .leave { opacity: 0 !important; transform: translateY(8px) !important; transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease); pointer-events: none; }
  @keyframes pulse { 0%, 100% { opacity: .1; transform: scale(.9); } 50% { opacity: .8; transform: scale(1.15); } }
  @keyframes shimmer { to { transform: translateX(100%); } }

  /* ── left: progress rail ── */
  #rail { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); position: relative; flex: none; }
  #rail::before { content: ''; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 7px; height: 2px; background: var(--line); }
  #rail .fill { position: absolute; left: calc(100% / 12); top: 7px; height: 2px; background: var(--accent); width: 0; transition: width var(--slow) var(--ease); }
  .step { position: relative; text-align: center; color: var(--faint); padding-top: 28px; }
  .step .dot { position: absolute; top: 0; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line-2); transition: border-color var(--fast), background var(--fast), transform var(--fast) var(--ease); display: grid; place-items: center; }
  .step .dot svg { width: 9px; height: 9px; } .step .dot svg path { stroke: var(--accent-ink); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset var(--slow) var(--ease) 120ms; }
  .step.done .dot { background: var(--accent); border-color: var(--accent); } .step.done .dot svg path { stroke-dashoffset: 0; }
  .step.now .dot { border-color: var(--accent); transform: scale(1.3); }
  .step.now .dot::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid var(--accent); animation: pulse 1.6s var(--ease) infinite; }
  .step .l { display: block; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .step.done .l { color: var(--text-2); } .step.now .l { color: var(--accent); }
  .step .by { display: block; margin-top: 4px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); opacity: 0; transition: opacity var(--fast); }
  .step.now .by { opacity: 1; color: var(--muted); }

  /* ── left: focus ── */
  #focus { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
  .wish { max-width: 960px; font-size: 48px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; }
  .wish.quiet { color: var(--faint); font-weight: 500; font-size: 36px; }
  .wish .who { display: block; margin-top: 18px; font: 500 17px/1 var(--mono); color: var(--muted); letter-spacing: .02em; }
  .live-line { display: inline-flex; align-items: center; gap: 14px; font-size: 19px; color: var(--muted); }
  .live-line i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s infinite; }

  .people { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .people .n { display: flex; align-items: baseline; gap: 18px; }
  .people .n b { font: 600 150px/1 var(--mono); color: var(--accent); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .people .n span { font-size: 28px; color: var(--text-2); }
  .avatars { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
  .av { position: relative; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font: 600 16px/1 var(--mono); color: var(--text); letter-spacing: .04em; border: 1px solid var(--line-2); animation: pop var(--slow) var(--ease) both; animation-delay: calc(var(--i) * 150ms); transition: transform var(--fast) var(--ease), opacity var(--fast); }
  @keyframes pop { from { opacity: 0; transform: scale(.5); } }

  .phone { display: flex; flex-direction: column; gap: 10px; width: 700px; }
  .bubble { max-width: 88%; padding: 14px 20px; border-radius: 22px; font-size: 20px; line-height: 1.35; text-align: left; animation: rise var(--slow) var(--ease) both; transition: opacity var(--fast), transform var(--fast); }
  .bubble.them { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; color: var(--text-2); }
  .bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); font: 600 18px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; border-bottom-right-radius: 6px; }
  .typing { align-self: flex-end; color: var(--faint); font: 500 13px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px; animation: pulse 1.4s infinite; }

  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; width: 600px; }
  .check { position: relative; overflow: hidden; display: flex; align-items: center; gap: 18px; padding: 18px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-size: 24px; text-align: left; animation: rise var(--fast) var(--ease) both; transition: opacity var(--fast), transform var(--fast); }
  .check .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; }
  .check svg { width: 16px; height: 16px; } .check svg path { stroke: var(--accent); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset var(--slow) var(--ease) 80ms; }
  .check.ok .box { border-color: var(--accent); } .check.ok svg path { stroke-dashoffset: 0; }
  .check.live .box { border-color: var(--accent); }
  .check.live::after, .working::after, .lib-row.upgrading::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(240,165,58,.08) 50%, transparent 80%); transform: translateX(-100%); animation: shimmer 1.4s var(--ease) infinite; pointer-events: none; }

  .app { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  .made { display: flex; flex-direction: column; gap: 6px; animation: rise var(--slow) var(--ease) both; }
  .made .k { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .made .t { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
  .preview { position: relative; width: 600px; height: 560px; border-radius: 16px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); transition: height var(--slow) var(--ease); flex: none; }
  .preview.short { height: 400px; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; opacity: 0; transform: scale(.985); transition: opacity var(--slow) var(--ease), transform var(--slow) var(--ease); }
  .preview iframe.on { opacity: 1; transform: none; }
  .vtag { position: absolute; top: 12px; right: 12px; z-index: 2; background: var(--bg); color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 9px; font: 600 12px/1 var(--mono); letter-spacing: .1em; animation: rise var(--fast) var(--ease) both; }
  .line { display: inline-flex; align-items: center; gap: 14px; font-size: 19px; color: var(--text-2); animation: rise var(--slow) var(--ease) both; }
  .line i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
  .line .u { font: 500 15px/1 var(--mono); color: var(--muted); }
  .status { font-size: 32px; color: var(--muted); }

  /* ── right: library ── */
  #library { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: none; }
  .lib-row { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); animation: rise var(--fast) var(--ease) both; transition: opacity var(--fast), transform var(--fast), border-color var(--fast); }
  .lib-row .name { flex: 1; min-width: 0; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  .lib-row .v { font: 600 12px/1 var(--mono); letter-spacing: .08em; color: var(--muted); padding: 5px 7px; border: 1px solid var(--line-2); border-radius: 5px; }
  .lib-row.bumped .v { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .lib-row .st { font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; min-width: 96px; justify-content: flex-end; }
  .lib-row .st i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .lib-row.upgrading { border-color: var(--accent); } .lib-row.upgrading .st { color: var(--accent); } .lib-row.upgrading .st i { background: var(--accent); animation: pulse 1.4s infinite; }
  .lib-row.new .st i { background: var(--accent); }

  /* ── right: the request being worked on ── */
  #issue { flex: 1; min-height: 0; margin-top: 22px; display: flex; flex-direction: column; gap: 14px; }
  #watching { margin-top: auto; margin-bottom: auto; align-self: center; }
  .req { display: flex; flex-direction: column; gap: 4px; animation: rise var(--slow) var(--ease) both; }
  .req .k { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .req .k b { color: var(--text-2); font-weight: 600; letter-spacing: .06em; }
  .req q { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; quotes: '“' '”'; }
  .req .on { font-size: 15px; color: var(--muted); }
  .req .on b { color: var(--text-2); font-weight: 600; }
  .phone.small { width: 100%; gap: 8px; }
  .phone.small .bubble { font-size: 17px; padding: 11px 16px; max-width: 92%; }
  .phone.small .bubble.me { font-size: 15px; }
  .said { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; animation: rise var(--fast) var(--ease) both; }
  .said b { color: var(--accent-ink); background: var(--accent); padding: 5px 7px; border-radius: 4px; letter-spacing: .08em; }
  .working { position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px; padding: 16px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-size: 20px; animation: rise var(--fast) var(--ease) both; }
  .working .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--accent); flex: none; }
  .working .by { margin-left: auto; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; animation: rise var(--slow) var(--ease) both; }
  .shot { position: relative; height: 330px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .shot .tag { position: absolute; left: 12px; bottom: 12px; font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 6px 8px; border-radius: 5px; background: rgba(13,12,10,.85); color: var(--text-2); border: 1px solid var(--line-2); }
  .shot.after { border-color: var(--accent); } .shot.after .tag { color: var(--accent); border-color: var(--accent); }
  .result { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); font-size: 19px; animation: settle var(--slow) var(--ease) both; }
  .result .v { font: 600 14px/1 var(--mono); letter-spacing: .1em; color: var(--accent-ink); background: var(--accent); padding: 6px 8px; border-radius: 5px; }
  .result .r { margin-left: auto; font: 500 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .result.declined { border-color: var(--line-2); background: var(--panel); color: var(--text-2); }
  @keyframes settle { 0% { opacity: 0; transform: translateY(-8px); } 55% { transform: translateY(4px); } 100% { opacity: 1; transform: none; } }

  /* ── footer ── */
  footer { display: flex; align-items: flex-end; gap: 48px; height: 72px; flex: none; margin-top: 20px; }
  .heard { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .heard .h { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .heard .w { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; animation: rise var(--slow) var(--ease) both; transition: opacity var(--fast), transform var(--fast); }
  .heard .w b { color: var(--text-2); font-weight: 500; }
  .heard .w .ex { color: var(--accent); }
  .qr { display: flex; align-items: center; gap: 14px; }
  .qr .code { width: 72px; height: 72px; background: #fff; padding: 5px; border-radius: 8px; }
  .qr .code img, .qr .code canvas { width: 62px !important; height: 62px !important; display: block; }
  .qr .l { font: 500 13px/1.5 var(--mono); color: var(--muted); }
  .qr .l b { display: block; color: var(--text-2); font-weight: 600; }
  body.focus footer { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .preview iframe { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="wordmark">Genie</div>
    <span id="sample" class="chip hide">Sample</span>
    <div class="stats" id="stats"></div>
    <div class="clock" id="clock"></div>
  </header>
  <div id="cols">
    <section id="left">
      <div class="eyebrow"><i></i><span>New wish</span><span class="n" id="leftN"></span></div>
      <ol id="rail"><div class="fill"></div></ol>
      <div id="focus">
        <div id="wish" class="wish quiet">Listening for wishes…</div>
        <div id="searching" class="live-line hide"><i></i><span></span></div>
        <div id="people" class="people hide"><div class="n"><b data-v="0">0</b><span>people asked for this</span></div><div class="avatars" id="avatars"></div></div>
        <div id="phone" class="phone hide"></div>
        <ul id="checks" class="checks hide"></ul>
        <div id="app" class="app hide"><div class="made" id="made"></div><div class="preview" id="preview"></div><div id="liveLine"></div></div>
        <div id="status" class="status hide"></div>
      </div>
    </section>
    <section id="right">
      <div class="eyebrow"><span>Library</span><span class="n" id="rightN"></span></div>
      <ol id="library"></ol>
      <div id="issue">
        <div id="watching" class="live-line"><i></i><span>Watching GitHub issues and r/GenieGrants</span></div>
      </div>
    </section>
  </div>
  <footer>
    <div class="heard" id="heard"></div>
    <div id="qr" class="qr hide"></div>
  </footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const uniq = (askers = []) => new Set(askers.map((a) => a.author.toLowerCase())).size
const STEPS = [
  { label: 'Found', by: 'Parallel' }, { label: 'Wanted', by: 'Parallel' }, { label: 'You said yes', by: 'Photon' },
  { label: 'Built', by: 'Cline' }, { label: 'You said post', by: 'Photon' }, { label: 'Live', by: 'Composio' },
]
const AT = { found: 0, validating: 1, awaiting_approval: 2, building: 3, testing: 3, awaiting_post_approval: 4, launched: 6, maintaining: 6, exists: 1, rejected: 2, shelved: 5, failed: 3 }
const LIVE = (a) => a.stage === 'launched' || a.stage === 'maintaining'
const AV_COLORS = ['#3d3729', '#2d3a39', '#3b2f35', '#2f3a2c', '#3a3330', '#2c3340', '#3a2d2a', '#33382f']
const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7)
const initials = (name) => { const p = name.replace(/^fake_/, '').split(/[_\-.]+/).filter(Boolean); return ((p[0]?.[0] ?? '') + (p[1]?.[0] ?? p[0]?.[1] ?? '')).toUpperCase() }
const mmss = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
const startOf = (a) => a.stageAt?.found ?? a.stageAt?.validating
const CHECK = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>'
const name = (a) => a.spec ?? a.wish?.text ?? a.slug
const OPEN = ['triaged', 'awaiting_approval', 'fixing', 'testing', 'shipping']
let NOW = () => Date.now() // the replay moves this

// Scale the 1920×1080 stage to the window.
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('#stage').style.transform = `translate(-50%, -50%) scale(${s})` }
addEventListener('resize', fit); fit()

// ── keyed DOM sync: creates, updates and removes children; untouched nodes keep their animations ──
const keyed = new Map()
function sync(parent, items) {
  let m = keyed.get(parent)
  if (!m) { m = new Map(); keyed.set(parent, m) }
  const keys = new Set(items.map((i) => i.key))

  let prev = null
  items.forEach((it, i) => {
    const cls = it.cls || ''
    let rec = m.get(it.key)
    if (!rec) {
      const el = document.createElement(it.tag || 'div')
      el.className = cls; el.style.setProperty('--i', i); el.innerHTML = it.html
      if (it.attrs) for (const [k, v] of Object.entries(it.attrs)) el.setAttribute(k, v)
      rec = { el, html: it.html, cls }; m.set(it.key, rec)

    } else {
      if (rec.html !== it.html) { rec.el.innerHTML = it.html; rec.html = it.html }
      if (rec.cls !== cls) { rec.el.className = cls; rec.cls = cls }
      let want = prev ? prev.nextElementSibling : parent.firstElementChild
      while (want && want.classList.contains('leave')) want = want.nextElementSibling
      if (want !== rec.el) prev ? prev.after(rec.el) : parent.prepend(rec.el)
    }
    prev = rec.el
  })
}
function tween(el, to, dur = 700) {
  const from = Number(el.dataset.v || 0); if (from === to) return
  el.dataset.v = to; const t0 = performance.now()
  const step = (now) => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step) }
  requestAnimationFrame(step)
}
const show = (el, on) => el.classList.toggle('hide', !on)
const setText = (el, t) => { if (el.textContent !== t) el.textContent = t }
const setHTML = (el, h) => { if (el.innerHTML !== h) el.innerHTML = h }

// The wish the build loop is on (left side).
function building(s) {
  const all = [...s.apps, ...s.candidates]
  if (s.builder) { const a = all.find((a) => a.slug === s.builder.slug); if (a) return a }
  return s.candidates.find((a) => a.stage !== 'exists') ?? null
}
// The request the maintain loop is on, or the last one it finished (right side).
function request(s) {
  let best = null
  for (const a of s.apps) for (const i of a.issues ?? []) {
    if (i.status === 'ignored') continue
    if (!best || (i.reportedAt ?? 0) > (best.issue.reportedAt ?? 0)) best = { app: a, issue: i }
  }
  return best
}

// ── rail ──
$('#rail').insertAdjacentHTML('beforeend', STEPS.map((st, i) => `<li class="step" id="step${i}"><span class="dot">${CHECK}</span><span class="l">${st.label}</span><span class="by">via ${st.by}</span></li>`).join(''))
function renderRail(app) {
  const at = app ? AT[app.stage] ?? 0 : -1
  const n = app ? uniq(app.askers) : 0
  STEPS.forEach((st, i) => {
    const el = $(`#step${i}`)
    el.classList.toggle('done', i < at); el.classList.toggle('now', i === at)
    setText(el.querySelector('.l'), i === 1 && n ? `${n} people asked` : st.label)
  })
  $('#rail .fill').style.width = at <= 0 ? '0' : `calc(${Math.min(at, 5)} * 100% / 6)`
}

// ── clock ──
let clockApp = null
function tickClock() {
  const el = $('#clock'), a = clockApp
  if (!a) { if (el.innerHTML) el.innerHTML = ''; return }
  const end = a.stageAt?.launched
  const html = end ? `<b>${mmss(end - startOf(a))}</b><span>wish → live app</span>` : `<b class="live">${mmss(NOW() - startOf(a))}</b><span>since the wish</span>`
  setHTML(el, html)
}
setInterval(tickClock, 250)

// ── left ──
let previewKey = ''
function renderPreview(app) {
  const box = $('#preview'), key = `${app.slug}@${app.version}`
  if (previewKey === key) return
  previewKey = key
  const old = box.querySelector('iframe')
  const f = document.createElement('iframe'); f.src = `${app.url}?v=${app.version}`
  f.addEventListener('load', () => { f.classList.add('on'); if (old) setTimeout(() => old.remove(), 560) }, { once: true })
  box.prepend(f)
  let tag = box.querySelector('.vtag'); if (!tag) { tag = document.createElement('div'); tag.className = 'vtag'; box.append(tag) }
  tag.textContent = `v${app.version}`; tag.style.animation = 'none'; void tag.offsetWidth; tag.style.animation = ''
}
function renderLeft(s, app) {
  const stage = app?.stage ?? 'none'
  const n = app ? uniq(app.askers) : 0
  clockApp = app && startOf(app) && !['exists', 'rejected'].includes(stage) ? app : null
  tickClock()
  setText($('#leftN'), app && s.candidates.length > 1 ? `${s.candidates.filter((a) => a.stage !== 'exists').length} candidates` : '')

  // the wish itself, big, until people show up
  const wishStage = stage === 'none' || ((stage === 'found' || stage === 'validating') && n === 0)
  show($('#wish'), wishStage)
  if (wishStage) {
    const html = app ? `${esc(app.wish.text)}${app.wish.author ? `<span class="who">u/${esc(app.wish.author)}</span>` : ''}` : 'Listening for wishes…'
    if ($('#wish').innerHTML !== html) { $('#wish').innerHTML = html; $('#wish').classList.add('in') }
    $('#wish').classList.toggle('quiet', !app)
  }
  show($('#searching'), wishStage && !!app)
  if (wishStage && app) setText($('#searching span'), stage === 'found' ? 'Reading it' : 'Looking for other people who asked')

  // how many people, as faces
  const peopleStage = n > 0 && ['validating', 'awaiting_approval', 'rejected'].includes(stage)
  show($('#people'), peopleStage)
  if (peopleStage) {
    sync($('#avatars'), app.askers.map((k) => ({ key: k.author.toLowerCase(), tag: 'a', cls: 'av', attrs: { href: k.url, target: '_blank', rel: 'noopener', title: `u/${k.author}${k.source && k.source !== 'reddit' ? ` · ${k.source}` : ''}`, style: `background:${AV_COLORS[hash(k.author) % AV_COLORS.length]}` }, html: esc(initials(k.author)) })))
    tween($('#people .n b'), n, Math.max(500, n * 150))
  }

  // the text to the owner, and the reply landing
  const kind = stage === 'awaiting_approval' ? 'build' : stage === 'awaiting_post_approval' ? 'post' : null
  const approvals = kind ? (app.approvals ?? []).filter((x) => x.kind === kind) : []
  show($('#phone'), approvals.length > 0)
  if (approvals.length) {
    const x = approvals.at(-1), i = approvals.length - 1
    const items = [{ key: `q${i}`, cls: 'bubble them', html: esc(x.text) }]
    items.push(x.reply ? { key: `r${i}`, cls: 'bubble me', html: esc(x.reply) } : { key: `t${i}`, cls: 'typing', html: 'Waiting for you' })
    sync($('#phone'), items)
  }

  // build checklist
  const isBuilding = stage === 'building' || stage === 'testing' || stage === 'failed'
  show($('#checks'), isBuilding)
  if (isBuilding) {
    const done = app.checks ?? []
    const items = done.map((c) => ({ key: c.label, tag: 'li', cls: `check ${c.ok ? 'ok' : ''}`, html: `<span class="box">${CHECK}</span>${esc(c.label)}` }))
    const next = done.length === 0 ? 'Writing the app' : stage === 'testing' ? 'Testing it' : null
    if (next && stage !== 'failed') items.push({ key: 'live', tag: 'li', cls: 'check live', html: `<span class="box"></span>${next}` })
    sync($('#checks'), items)
  }

  // the app, live
  const appStage = app?.url && (stage === 'awaiting_post_approval' || LIVE(app) || stage === 'shelved')
  show($('#app'), !!appStage)
  if (appStage) {
    const others = Math.max(0, n - 1)
    const made = `<div class="k">Genie built this${app.wish.author ? ` for u/${esc(app.wish.author)}${others ? ` and ${others} other${others > 1 ? 's' : ''}` : ''}` : ''}${LIVE(app) ? '' : ' · not posted yet'}</div><div class="t">${esc(name(app))}</div>`
    setHTML($('#made'), made)
    $('#preview').classList.toggle('short', stage === 'awaiting_post_approval')
    renderPreview(app)
    const line = LIVE(app)
      ? `<div class="line"><i></i><span>Live on r/GenieGrants</span>${app.launchUrl ? `<span class="u">${esc(app.launchUrl.replace(/^https?:\/\/(www\.)?/, ''))}</span>` : ''}</div>`
      : stage === 'shelved' ? `<div class="line"><span>Kept private</span></div>` : ''
    setHTML($('#liveLine'), line)
  } else { $('#preview').innerHTML = ''; previewKey = ''; $('#liveLine').innerHTML = ''; $('#made').innerHTML = '' }

  const msg = { rejected: 'Skipped', failed: "Couldn't build this one" }[stage]
  show($('#status'), !!msg); if (msg) setText($('#status'), msg)
}

// ── right ──
function renderRight(s) {
  const live = s.apps.filter(LIVE).sort((a, b) => (a.stageAt?.launched ?? 0) - (b.stageAt?.launched ?? 0))
  setText($('#rightN'), live.length ? `looking after ${live.length} app${live.length > 1 ? 's' : ''}` : '')
  const req = request(s)
  const recent = NOW() - 10 * 60_000
  sync($('#library'), live.map((a) => {
    const open = (a.issues ?? []).some((i) => OPEN.includes(i.status))
    const isNew = (a.stageAt?.launched ?? 0) > recent && !a.seeded
    const cls = `lib-row ${open ? 'upgrading' : ''} ${a.version > 1 ? 'bumped' : ''} ${isNew ? 'new' : ''}`
    const st = open ? 'Upgrading' : isNew ? 'Just launched' : 'Live'
    return { key: a.slug, tag: 'li', cls, html: `<span class="name">${esc(name(a))}</span><span class="v">v${a.version}</span><span class="st"><i></i>${st}</span>` }
  }))

  show($('#watching'), !req)
  const box = $('#issue')
  if (!req) { sync(box, []); return }
  const { app, issue } = req
  const st = issue.status
  const where = issue.source === 'github' ? `GitHub${issue.url ? ` #${issue.url.split('/').pop()}` : ''}` : issue.source === 'reddit' ? 'r/GenieGrants' : 'iMessage'
  const who = issue.author ? ` · ${issue.source === 'reddit' ? 'u/' : '@'}${esc(issue.author.replace(/^[@]|^u\//, ''))}` : ''
  const verb = issue.kind === 'bug' ? 'Fixing' : 'Adding'
  const items = [{ key: issue.id, cls: 'req', html: `<div class="k"><b>${issue.kind === 'bug' ? 'Bug report' : 'Request'}</b> ${esc(where)}${who}</div><q>${esc(issue.text)}</q><div class="on">on <b>${esc(name(app))}</b></div>` }]

  const ap = (app.approvals ?? []).filter((x) => x.kind === 'issue' && x.issueId === issue.id)
  const x = ap.at(-1)
  if (st === 'awaiting_approval' && x) {
    const ph = [{ key: `q${ap.length}`, cls: 'bubble them', html: esc(x.text) }]
    ph.push(x.reply ? { key: `r${ap.length}`, cls: 'bubble me', html: esc(x.reply) } : { key: `t${ap.length}`, cls: 'typing', html: 'Waiting for you' })
    items.push({ key: `phone-${issue.id}`, cls: 'phone small', html: '', children: ph })
  } else if (x?.reply) {
    items.push({ key: `said-${issue.id}`, cls: 'said', html: `You said <b>${esc(x.reply)}</b>` })
  }
  if (st === 'fixing' || st === 'testing' || st === 'shipping') {
    const [what, by] = st === 'fixing' ? [`${verb} ${esc(issue.title)}`, 'Cline'] : st === 'testing' ? ['Testing it again', 'Playwright'] : [`Shipping v${app.version}`, 'GitHub']
    items.push({ key: `work-${issue.id}`, cls: 'working', html: `<span class="box"></span><span>${what}</span><span class="by">via ${by}</span>` })
  }
  if (st === 'fixed') {
    if (issue.before && issue.after) items.push({ key: `shots-${issue.id}`, cls: 'shots', html: `<div class="shot"><img src="${esc(issue.before)}" alt=""><span class="tag">Before · v${issue.version - 1}</span></div><div class="shot after"><img src="${esc(issue.after)}" alt=""><span class="tag">After · v${issue.version}</span></div>` })
    const secs = issue.fixedAt && issue.repliedAt ? Math.round((issue.fixedAt - issue.repliedAt) / 1000) : null
    items.push({ key: `done-${issue.id}`, cls: 'result', html: `<span class="v">v${issue.version}</span><span>${issue.kind === 'bug' ? 'Fixed' : 'Added'} ${esc(issue.title)}${secs ? ` in ${secs}s` : ''}</span><span class="r">Replied ✅ on ${esc(where.split(' ')[0])}</span>` })
  }
  if (st === 'declined') items.push({ key: `done-${issue.id}`, cls: 'result declined', html: `<span>Not planned</span><span class="r">Replied on ${esc(where.split(' ')[0])}, closed</span>` })
  sync(box, items)
  // nested bubbles for the phone
  const ph = box.querySelector(`.phone.small`)
  const spec = items.find((i) => i.children)
  if (ph && spec) sync(ph, spec.children)
}

// ── footer ──
function renderFooter(s, app) {
  const all = [...s.apps, ...s.candidates]
  const live = s.apps.filter(LIVE)
  const vals = [
    ['Wishes heard', all.length],
    ['Apps live', live.length],
    ['Upgrades shipped', s.apps.reduce((n, a) => n + (a.issues ?? []).filter((i) => i.status === 'fixed').length, 0)],
  ]
  sync($('#stats'), vals.map(([label]) => ({ key: label, cls: 'stat', html: `<b data-v="0">0</b><span>${label}</span>` })))
  vals.forEach(([, v], i) => tween($('#stats').children[i].querySelector('b'), v))

  const others = s.candidates.filter((a) => a !== app && a.wish?.text).sort((a, b) => (startOf(b) ?? 0) - (startOf(a) ?? 0)).slice(0, 2)
  const items = others.length ? [{ key: 'h', cls: 'h', html: 'Also heard' }] : []
  for (const a of others) items.push({ key: a.slug, cls: 'w', html: `<b>${esc(a.wish.text)}</b>${a.stage === 'exists' && a.existingTool ? ` <span class="ex">→ already exists: ${esc(a.existingTool.name)}</span>` : a.askers?.length ? ` <span>· ${uniq(a.askers)} asked</span>` : ''}` })
  sync($('#heard'), items)
}
let qrFor = ''
function renderQR(s) {
  const live = s.apps.filter(LIVE).at(-1)
  const url = s.sample ? 'https://www.reddit.com/r/GenieGrants/' : live?.pagesUrl ?? live?.launchUrl ?? 'https://www.reddit.com/r/GenieGrants/'
  show($('#qr'), typeof QRCode !== 'undefined')
  if (qrFor === url || typeof QRCode === 'undefined') return
  qrFor = url
  $('#qr').innerHTML = `<div class="code"></div><div class="l"><b>${url.includes('reddit') ? 'r/GenieGrants' : 'Open the app'}</b>${esc(url.replace(/^https?:\/\/(www\.)?/, ''))}</div>`
  new QRCode($('#qr .code'), { text: url, width: 62, height: 62, colorDark: '#0d0c0a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M })
}

function render(s) {
  const app = building(s)
  show($('#sample'), !!s.sample)
  renderRail(app); renderLeft(s, app); renderRight(s); renderFooter(s, app); renderQR(s)
}

// ── polling, replay, presenter keys ──
let last = '', live = null, replaying = false
async function tick() {
  try {
    const text = await (await fetch('/state', { cache: 'no-store' })).text()
    if (text !== last) { last = text; live = JSON.parse(text); if (!replaying) render(live) }
  } catch {}
  setTimeout(tick, 1000)
}
tick()

// What the state looked like at time t. Seeded apps were "built yesterday" and only their issues move.
function rewind(s, t) {
  const ev = (s.events ?? []).filter((e) => e.t <= t)
  const issuesAt = (a) => (a.issues ?? []).filter((i) => (i.reportedAt ?? 0) <= t).map((i) => {
    if (i.status === 'ignored') return i
    if ((i.resolvedAt ?? Infinity) <= t) return i
    const status = (i.repliedAt ?? Infinity) <= t ? 'fixing' : (i.askedAt ?? Infinity) <= t ? 'awaiting_approval' : 'triaged'
    return { ...i, status, fixedAt: undefined, resolvedAt: undefined, version: undefined, after: undefined }
  })
  const approvalsAt = (a) => (a.approvals ?? []).filter((x) => x.askedAt <= t).map((x) => (x.repliedAt && x.repliedAt <= t ? x : { ...x, reply: undefined, repliedAt: undefined }))
  const map = (a) => {
    const issues = issuesAt(a)
    if (a.seeded) {
      const version = 1 + issues.filter((i) => i.status === 'fixed').length
      return { ...a, issues, version, changelog: (a.changelog ?? []).filter((c) => c.at <= t) }
    }
    const mine = ev.filter((e) => e.slug === a.slug)
    if (!mine.length) return null
    const stage = mine.at(-1).stage
    const stageAt = Object.fromEntries(Object.entries(a.stageAt ?? {}).filter(([, v]) => v <= t))
    const isLive = stage === 'launched' || stage === 'maintaining'
    const version = isLive ? 1 + issues.filter((i) => i.status === 'fixed').length : AT[stage] >= 3 ? 1 : 0
    const checks = stage === 'building' ? [] : stage === 'testing' ? (a.checks ?? []).slice(0, 1) : a.checks
    return { ...a, stage, stageAt, approvals: approvalsAt(a), issues, version, checks, askers: stage === 'found' ? [] : a.askers, launchUrl: isLive ? a.launchUrl : undefined, pagesUrl: isLive ? a.pagesUrl : undefined }
  }
  const apps = s.apps.map(map).filter(Boolean), candidates = s.candidates.map(map).filter(Boolean)
  const all = [...apps, ...candidates]
  const pend = all.find((a) => a.approvals?.at(-1) && !a.approvals.at(-1).reply)
  const lastBuildEv = [...ev].reverse().find((e) => !s.apps.find((a) => a.slug === e.slug)?.seeded)
  return { ...s, apps, candidates, builder: lastBuildEv ? { slug: lastBuildEv.slug } : undefined, pendingApproval: pend ? { slug: pend.slug, kind: pend.approvals.at(-1).kind } : undefined }
}
function resetBoard() {
  keyed.clear(); qrFor = ''; previewKey = ''; NOW = () => Date.now()
  for (const id of ['avatars', 'phone', 'checks', 'preview', 'liveLine', 'made', 'stats', 'heard', 'qr', 'library']) $('#' + id).innerHTML = ''
  for (const el of [...$('#issue').children]) if (el.id !== 'watching') el.remove() // copy first: removing while iterating a live collection skips nodes
  $('#wish').innerHTML = ''; $('#people .n b').dataset.v = 0; $('#people .n b').textContent = '0'
  for (let i = 0; i < 6; i++) $(`#step${i}`).className = 'step'
}
async function replay() {
  if (!live || replaying) return
  const s = live
  const times = new Set((s.events ?? []).map((e) => e.t))
  for (const a of [...s.apps, ...s.candidates]) {
    if (!a.seeded) for (const x of a.approvals ?? []) { times.add(x.askedAt); if (x.repliedAt) times.add(x.repliedAt) }
    for (const i of a.issues ?? []) for (const k of ['reportedAt', 'askedAt', 'repliedAt', 'fixedAt', 'resolvedAt']) if (i[k]) times.add(i[k])
  }
  const pts = [...times].sort((a, b) => a - b)
  if (!pts.length) return
  replaying = true; resetBoard()
  render(rewind(s, pts[0] - 1))
  await new Promise((r) => setTimeout(r, 900))
  let prev = pts[0]
  for (const t of pts) {
    if (!replaying) return
    await new Promise((r) => setTimeout(r, Math.min(2600, Math.max(900, (t - prev) / 2))))
    prev = t
    NOW = () => t + 1
    render(rewind(s, t + 1))
  }
  replaying = false
  setTimeout(() => { if (!replaying && live) { NOW = () => Date.now(); render(live) } }, 1500)
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R' || e.key === 'Escape') { replaying = false; resetBoard(); if (live) render(live) }
  if (e.key === ' ') { e.preventDefault(); replaying ? (replaying = false, resetBoard(), live && render(live)) : replay() }
  if (e.key === 'f' || e.key === 'F') document.body.classList.toggle('focus')
})
</script>
</body>
</html>
